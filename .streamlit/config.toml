# Theme toàn cục cho dashboard — phong cách Our World in Data.
# Đặt một lần ở đây, mọi trang tự áp dụng. Thành viên không cần chỉnh.
[theme]
base = "light"
primaryColor = "#B13507"              # accent vermillion (link, widget active, nút)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F5F2"  # nền phụ ấm (sidebar, card)
textColor = "#1D1D1D"
font = "sans-serif"                    # body và biểu đồ dùng sans
headingFont = "serif"                 # tiêu đề dùng serif (editorial OWID)
baseRadius = "0.4rem"
borderColor = "#E7E5E0"
